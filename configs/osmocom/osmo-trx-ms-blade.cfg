log stderr
 logging filter all 1
 logging color 1
 logging print category 1
 logging timestamp 1
 logging print file basename
 logging level set-all error
!
line vty
 no login
!
cpu-sched
 policy rr 18
!
trx
 bind-ip 0.0.0.0
 remote-ip 127.0.0.1
 base-port 5700
 # EGPRS explicitly unsupported in this backend
 egprs disable
 tx-sps 4
 rx-sps 4
 chan 0
  rx-gain 30
  tx-gain 30
  tx-attenuation 0
  rx-bandwidth 2000000
  tx-bandwidth 2000000
